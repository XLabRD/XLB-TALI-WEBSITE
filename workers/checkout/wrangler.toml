# Cloudflare Worker config for the Tali checkout backend (DEC-21).
# Deploy from this directory: npx wrangler deploy
name = "tali-checkout"
main = "worker.js"
compatibility_date = "2026-07-01"

# Daily USD→MXN price sync (DEC-26). 16:30 UTC = 10:30 Mexico City, after the
# ECB publishes the day's reference rates (~15:00 UTC).
[triggers]
crons = ["30 16 * * *"]

[vars]
# Live-mode Founder Edition price ($125 introductory; the $185 launch price
# price_1TypWV2QQj9hlFmfJYXOVDNE is archived).
STRIPE_PRICE_ID = "price_1U5xPL2QQj9hlFmfYtSkOK1o"
# Margin added on top of the spot rate when computing the MXN currency_option,
# covering drift between daily runs. Raise it if the peso gets choppy.
FX_BUFFER_PCT = "3"

# Founders waves + cap (DEC-27). Founders is 100 units in two waves of 50:
# wave 1 ships September 2026, wave 2 October–December 2026. Unit 101 onward
# is the Signature Series (unlimited, Feb–Apr 2027).
# Ship-window wording lives in src/content/site/home.json, in both locales —
# change a boundary here and the copy there must follow.
FOUNDERS_CAP = "100"
WAVE_SIZE = "50"
# The pricing card withholds the remaining count until a wave is this close to
# gone. Set it to 50 to always show a countdown, 0 to never.
WAVE_COUNTDOWN_AT = "15"
SITE = "https://tali.my"
# Origins allowed to call this worker (CORS). Localhost is for `npm run dev`.
ALLOWED_ORIGINS = "https://tali.my,http://localhost:4321"
# Countries the shipping-address form accepts (ISO 3166-1 alpha-2).
SHIP_COUNTRIES = "MX"
# "Pedidos" database on the author's workspace.
NOTION_DATABASE_ID = "3aa573dfb66a8042b266e6d6e64d211b"
# Sender identity lives in emails.js (FROM): "Dany from/de Tali <hello@tali.my>".
# Internal notifications (new order / abandoned cart). Empty = no staff emails.
STAFF_EMAIL = "xlab@protexa.mx"

# Duplicate-email guard for /notion-webhook, the 60s inventory-count cache,
# and the traffic counters behind /stats (DEC-29).
[[kv_namespaces]]
binding = "ORDERS"
id = "b075e56a1deb413daba059fdc523fef6"

# Additional secrets for the order pipeline (wrangler secret put …):
#   STRIPE_WEBHOOK_SECRET — whsec_… from the Stripe webhook endpoint
#   NOTION_TOKEN          — ntn_/secret_… internal-integration token
#   RESEND_API_KEY        — re_… from Resend
#   NOTION_WEBHOOK_KEY    — shared key in the Notion automation's webhook URL
#   STATS_KEY             — unlocks GET /stats for the site's /stats page
#                           (DEC-29). Unset = the route 503s and the page
#                           stays empty, which is the safe default.

# The secret key is NOT set here — never commit it. After deploying once, run:
#   npx wrangler secret put STRIPE_SECRET_KEY
# and paste the sk_test_… (later sk_live_…) key when prompted.

# Persist request logs and console output. Without this the only view into a
# failed webhook is a live `wrangler tail` that happens to already be running —
# which is why order #1's Notion error was invisible after the fact.
[observability]
enabled = true
head_sampling_rate = 1
