# Cloudflare Worker config for the Tali checkout backend (DEC-21).
# Deploy from this directory: npx wrangler deploy
name = "tali-checkout"
main = "worker.js"
compatibility_date = "2026-07-01"

[vars]
# TODO(DEC-21): test-mode Founder Edition price (prod_UwhXYNGJTgEnOM) —
# swap to the live-mode price ID at launch.
STRIPE_PRICE_ID = "price_1TyJIWCxifEa1k4SpmScJtK0"
SITE = "https://tali.my"
# Origins allowed to call this worker (CORS). Localhost is for `npm run dev`.
ALLOWED_ORIGINS = "https://tali.my,http://localhost:4321"
# Countries the shipping-address form accepts (ISO 3166-1 alpha-2).
SHIP_COUNTRIES = "MX"
# "Pedidos" database on the author's workspace.
NOTION_DATABASE_ID = "3aa573dfb66a8042b266e6d6e64d211b"
# Sender identity lives in emails.js (FROM): "Dany from/de Tali <hello@tali.my>".
# Internal notifications (new order / abandoned cart). Empty = no staff emails.
STAFF_EMAIL = "xlab@protexa.mx"

# Duplicate-email guard for /notion-webhook.
[[kv_namespaces]]
binding = "ORDERS"
id = "b075e56a1deb413daba059fdc523fef6"

# Additional secrets for the order pipeline (wrangler secret put …):
#   STRIPE_WEBHOOK_SECRET — whsec_… from the Stripe webhook endpoint
#   NOTION_TOKEN          — ntn_/secret_… internal-integration token
#   RESEND_API_KEY        — re_… from Resend
#   NOTION_WEBHOOK_KEY    — shared key in the Notion automation's webhook URL

# The secret key is NOT set here — never commit it. After deploying once, run:
#   npx wrangler secret put STRIPE_SECRET_KEY
# and paste the sk_test_… (later sk_live_…) key when prompted.
